[package]
name = "miyako_tsunami_desktop"
version = "1.14.0"
description = "Miyako Taro Tsunami — 宮古・田老津波 3Dシミュレーター"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "miyako_tsunami_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
